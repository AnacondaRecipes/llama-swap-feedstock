{% set name = "llama-swap" %}
{% set version = "262" %}
# Short commit embedded into `llama-swap --version` output so it matches
# upstream release-build metadata. We deliberately do NOT stamp main.date —
# our build isn't upstream's release build, so mirroring their timestamp
# would be misleading (per Stan Seibert review, PKG-17553).
{% set commit = "079c35ae8" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/mostlygeek/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 23d0f6e6aa5e9b3cc9c75e2c3f5b91f3362bd62e63040479a3f3d5db9a8a9f15
  # remark-math 6.0.0 and rehype-katex 7.0.1 omit this shared MIT text from npm.
  # Identical at both npm gitHead revisions; use rehype-katex's recorded revision.
  - url: https://raw.githubusercontent.com/remarkjs/remark-math/88a9497e1ede93b958237c85edbf5651faeca7af/license
    sha256: cb992262f361a5359e6771c28740d33c7041e15332ae8537fae40538992591a9
    fn: remark-math-LICENSE

build:
  number: 0
  # Go binary — no ABI to Python; skip: none needed.
  # binary_relocation: false — pure Go, no shared-lib prefix-rewriting to do.
  binary_relocation: false
  detect_binary_files_with_prefix: false
  script_env:
    - LLAMA_SWAP_VERSION=v{{ version }}
    - LLAMA_SWAP_COMMIT={{ commit }}

requirements:
  build:
    # go.mod requires Go 1.27.1; aggregate go_compiler_version is still 1.26.
    - go-nocgo >=1.27.1
    - {{ stdlib('c') }}
    - go-licenses
    # UI build-tool engines in ui/package-lock.json (Vite / Svelte plugin).
    - nodejs >=20.19,<21|>=22.12,<23|>=24
    - make  # [not win]

test:
  requires:
    - python *  # Test runner only; avoid per-Python builds of the Go binary.
  commands:
    # Upstream prints `version: v{{ version }} ({{ commit }}), built at unknown`.
    # Grepping for the stamped version + commit proves the -X ldflags in
    # build.sh / bld.bat actually landed on main.version / main.commit
    # (a plain `--version` invocation only proves the binary loads).
    - llama-swap --version | grep v{{ version }}                          # [unix]
    - llama-swap --version | grep {{ commit }}                            # [unix]
    - if not exist "%PREFIX%\Library\bin\llama-swap.exe" exit 1           # [win]
    - llama-swap --version | findstr v{{ version }}                       # [win]
    - llama-swap --version | findstr {{ commit }}                         # [win]

about:
  home: https://github.com/mostlygeek/llama-swap
  license: MIT AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC
  license_family: Other
  license_file:
    - LICENSE.md
    - library_licenses/
    - internal/server/ui_dist/third-party-licenses.json
    - remark-math-LICENSE
  summary: Reliable model swapping for any local OpenAI/Anthropic compatible server (llama.cpp, vllm, etc.)
  description: |
    llama-swap is a lightweight, transparent proxy server for local LLM
    inference engines like llama.cpp, vllm, and others. It watches your
    OpenAI/Anthropic-compatible requests, automatically swaps the underlying
    model / engine / flags based on the request, and forwards the traffic —
    letting a single endpoint serve many models with different runtime
    configurations. Ships with an embedded Svelte web UI for monitoring.
  doc_url: https://github.com/mostlygeek/llama-swap/tree/main/docs
  dev_url: https://github.com/mostlygeek/llama-swap

extra:
  recipe-maintainers:
    - sseibert
    - xkong-anaconda
